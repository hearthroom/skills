name: validate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # weekly: catch a chat-page contract that moved
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm test
      - name: contract matches the chat page
        run: node scripts/sync-contract.mjs --check
        continue-on-error: ${{ github.event_name == 'pull_request' }}
